[package]
name = "idl-library"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "The idl-rs ride library: catalog, content-addressed blob store, import and index jobs, bike log, sync model."
repository = "https://github.com/saucyeng/idl-rs"
readme = "README.md"
keywords = ["telemetry", "datalogger", "parquet", "imu", "catalog"]
categories = ["science", "database"]

[lib]
name = "idl_library"

[dependencies]
idl-rs = { path = "../core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arrow = "59.3.0"
parquet = "59.3.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.26.0", features = ["v4"] }
sha2 = "0.10.9"
serde_yaml_ng = "0.10.0"
memmap2 = "0.9"
# Per-session work fans out over a private pool of `physical cores - 1`
# workers (ruling R208 item 1) — `index_job`.
rayon = "1"
# Physical (not logical) core count, which `std` does not expose.
num_cpus = "1"

[dev-dependencies]
idl-rs = { path = "../core", version = "0.1.0", features = ["test-fixtures"] }
