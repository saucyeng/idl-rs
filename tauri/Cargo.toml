[package]
name = "idl-rs-tauri"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Tauri command glue over idl-rs and idl-transport. The only crate the idl1 frontend sees."

[dependencies]
idl-rs = { path = "../core" }
idl-transport = { path = "../transport" }
tauri = "2.11.5"
# "Ask an agent" (ruling R222 item 3) spawns the configured agent command
# through this plugin's Rust API only; the webview is granted no shell
# permission at all, so the allowlist is exactly that one call site.
tauri-plugin-shell = "2.3.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
notify = "8.2.0"
# The decode pool several channels of one request fan out over (ruling
# R232.2) — the same library, and the same width rule, as the indexing
# job's pool in `idl-rs`.
rayon = "1"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1.53.1", features = ["sync", "time", "macros", "rt", "fs", "io-util"] }
uuid = { version = "1", features = ["v4"] }
# Total physical memory only (ruling R203.2) — `std` exposes no such query.
# `default-features = false` + `system` keeps the disk/network/component
# collectors, and their platform dependencies, out of the build.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["test-util"] }
# `test_buffers` (Task 9's own `.idl0` fixture builders) is gated behind
# this feature (core/Cargo.toml) — enabled for test builds only, unified by
# Cargo with the plain `idl-rs` dependency above (same pattern `cli/Cargo.toml`
# uses non-dev, since the CLI needs it outside tests too).
idl-rs = { path = "../core", features = ["test-fixtures"] }
