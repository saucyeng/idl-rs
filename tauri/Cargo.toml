[package]
name = "idl-rs-tauri"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Tauri command glue over idl-rs and idl-transport. The only crate the idl1 frontend sees."

[dependencies]
idl-rs = { path = "../core" }
idl-transport = { path = "../transport" }
tauri = "2.11.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
notify = "8.2.0"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3.27.0"
