[package]
name = "idl-rs-tauri"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Tauri command glue over idl-rs and idl-transport. The only crate the idl1 frontend sees."

[dependencies]
idl-rs = { path = "../core" }
idl-transport = { path = "../transport" }
tauri = "2.11.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
notify = "8.2.0"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1.53.1", features = ["sync", "time", "macros", "rt", "fs", "io-util"] }
uuid = { version = "1", features = ["v4"] }
# Task 5's `delete_session` deletes `sessions`/`laps`/`lap_summary` rows via
# a direct `DELETE FROM sessions` (the schema's `ON DELETE CASCADE` foreign
# keys do the rest) — same version/features as `idl-rs` core's own
# dependency (core/Cargo.toml) so the two resolve to one build.
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["test-util"] }
# `test_buffers` (Task 9's own `.idl0` fixture builders) is gated behind
# this feature (core/Cargo.toml) — enabled for test builds only, unified by
# Cargo with the plain `idl-rs` dependency above (same pattern `cli/Cargo.toml`
# uses non-dev, since the CLI needs it outside tests too).
idl-rs = { path = "../core", features = ["test-fixtures"] }
