[package]
name = "idl-transport"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Device transport (BLE, WiFi transfer, config push) and LAN sync for idl1. I/O only; no DSP."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
btleplug = "0.13.0"
tokio = { version = "1.53.1", features = ["sync", "time", "macros"] }
# Pinned 2026-09-03, lead ruling R7 (docs/superpowers/specs/2026-09-02-idl1-m0-ecosystem.md).
# default-tls dropped: every WiFi endpoint (SPEC §6) is plain HTTP against
# 192.168.4.1 — no TLS stack needed, smaller build.
reqwest = { version = "0.13.4", default-features = false, features = ["stream"] }

[dev-dependencies]
serde_json = "1"
