[package]
name = "idl-transport"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Device transport (BLE, WiFi transfer, config push) and LAN sync for idl1. I/O only; no DSP."

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
