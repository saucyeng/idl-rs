name: rust
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The engine workspace is core, library and cli. The app-side crates
      # (idl1-bridge, idl1-transport) moved to the idl1-app repo on 2026-11-12
      # and are tested there; nothing here needs Tauri's system packages.
      - name: cargo test -p idl-rs -p idl-library -p idl-rs-cli
        run: cargo test -p idl-rs -p idl-library -p idl-rs-cli -- --test-threads=4

      # The two references are generated from the engine's own tables, so a
      # builtin or command changed without regenerating them fails here.
      - name: Generated references are up to date
        run: |
          cargo run -q -p idl-rs-cli -- docs workbook --out docs/WORKBOOK-REFERENCE.md --src docs/reference-src
          cargo run -q -p idl-rs-cli -- docs cli --out docs/CLI-REFERENCE.md
          git diff --exit-code -- docs/WORKBOOK-REFERENCE.md docs/CLI-REFERENCE.md
