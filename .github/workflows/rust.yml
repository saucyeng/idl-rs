name: rust
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # .cargo/config.toml pins target-dir to a Windows path shared across the
      # dev machine's worktrees; on Linux that path cannot be joined into
      # LD_LIBRARY_PATH. The env var overrides it.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The engine workspace is core, library and cli. The app-side crates
      # (idl1-bridge, idl1-transport) moved to the idl1-app repo on 2026-11-12
      # and are tested there; nothing here needs Tauri's system packages.
      - name: cargo test -p idl-rs -p idl-library -p idl-rs-cli
        run: cargo test -p idl-rs -p idl-library -p idl-rs-cli -- --test-threads=4
