[package]
name = "idl-rs"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Signal processing, .idl0 log parsing, importers, math-channel evaluation and Parquet storage for IDL telemetry."
repository = "https://github.com/saucyeng/idl-rs"
readme = "README.md"
keywords = ["telemetry", "signal-processing", "parquet", "datalogger", "imu"]
categories = ["science", "parser-implementations"]
# A real ride excerpt (3.4 MB) for the diagnostics in examples/; not shipped to crates.io.
exclude = ["tests/fixtures/walden-*.idl0"]

[lib]
name = "idl_rs"

[dependencies]
sci-rs = "0.4"
nalgebra = "0.33"
rustfft = "6.2"
realfft = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arrow = "59.3.0"
parquet = "59.3.0"
uuid = { version = "1.26.0", features = ["v4"] }
sha2 = "0.10.9"
pulldown-cmark = "0.13.4"
serde_yaml_ng = "0.10.0"
quick-xml = "0.41.0"
fitparser = "0.9"

[dev-dependencies]
approx = "0.5"

[features]
test-fixtures = []
