[package]
name = "idl-rs"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "idl_rs"

[dependencies]
sci-rs = "0.4"
nalgebra = "0.33"
rustfft = "6.2"
realfft = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arrow = "59.3.0"
parquet = "59.3.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.26.0", features = ["v4"] }
sha2 = "0.10.9"

[dev-dependencies]
approx = "0.5"
fitparser = "0.9"

[features]
test-fixtures = []
